      title: Activism. Care. Solidarity.
      body: With unified efforts, we aim to create profound political and social change toward a more equitable, decentralized and freedom-respecting digital commons.
      quote: Our task is to secure self-determination where we can, to hold back the coming dystopia where we cannot, and if all else fails, to accelerate its self-destruction.
      quoteAuthor: Julian Assange, Cypherpunks
