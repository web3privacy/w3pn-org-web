          body: Tools, resources, reports, courses and events will be free forever
        - title: POWERING CONTRIBUTORS
          body: To researchers, devs, and facilitators committed to advancing privacy
        - title: BUILDING A MOVEMENT
          body: Embrace open-source culture and multi disciplinary collaboration.
