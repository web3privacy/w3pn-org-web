  testimonials:
    title: What people say about us.
    items:
      - name: Peter Van Valkenburgh
        role: Aztec foundation
        image: /images/site-shared/profiles/peter-van-valkenburgh.webp
        priority: 1
        masonryColumn: 1
        masonryOrder: 0
        quote: The balance between Transparency and Privacy, accountable and unaccountable, manifest and secret, convex and concave, 1 and 0 is one of the most fun puzzles blockchain tech has to solve for the world. W3P community approaches this with incredible humility and a unravel-the-knot open debate approach. Also I like how they dress.
      - name: Kyle Den Harton
        role: Brave
        image: /images/site-shared/profiles/kyle-den-harton.webp
        priority: 2
        masonryColumn: 2
        masonryOrder: 0
        quote: The connections made at their events always help to really cut through the noise and meet the right people to make progress on making privacy the default as we evolve the Web ecosystem.
      - name: Sebastian Bürgel
        role: Gnosis Dao
        image: /images/site-shared/profiles/sebastian-burgel.webp
        priority: 3
        masonryColumn: 3
        masonryOrder: 0
        quote: I appreciate Web3 Privacy Now for upholding Cypherpunk values, which are at the core of the Web3 movement. In a space increasingly influenced by hyper-financialization, having an organization dedicated to principles that distinguish Web3 from Wall Street serves as a crucial guiding light.
      - name: Naomi Brockwell
        role: NBTV, Ludlow Institute
        image: /images/site-shared/profiles/naomi-brockwell.webp
        priority: 4
        masonryColumn: 1
        masonryOrder: 1
        quote: Over the last two years, I mostly stepped away from crypto events, feeling disconnected from the nihilistic, short-term focus dominating much of the space. While I still believe in the tech's potential for net-positive use cases, the focus on hyper-speculation wasn't something I could get excited about. So, I focused on the work we do with NBTV and Drips, ignoring the rest. Then, almost a year ago, I found Web3PrivacyNow. They managed to amplify the cypherpunk voice within the cryptocurrency space, proving it’s not just alive but growing stronger. There is a thriving, principled community in crypto that it’s worth contributing to. Today it’s their 2nd birthday. Happy Birthday, Web3PrivacyNow! Your mission is more important now than ever.
      - name: Alan
        role: Railgun
        image: /images/site-shared/profiles/alan.webp
        priority: 5
        masonryColumn: 2
        masonryOrder: 1
        quote: Web3privacy has been the best forum for crypto-privacy people to organize and discuss new ideas. It's where our sector's best and brightest gather.
      - name: Jaromil
        role: Dyne.org
        image: /images/site-shared/profiles/jaromil.webp
        priority: 6
        masonryColumn: 3
        masonryOrder: 1
        quote: 'I''ve been developing, lurking and partying around crypto for 15 years now and remember clearly there were some people worth knowing and making friends. The blockchain hype has been terrible because it flooded the space with obnoxious situations and a load of sociopaths, while interest in the most popular value proposition never faded: privacy for everyone and lower liability when running collective infrastructure. It has been a fine ride all the way, I just missed the part where we were making new interesting friendships. Thanks to Web3Privacy it is now back, and for this I am very grateful to this genuine community and its ways to keep alive the heartbeat of the real crypto movement.'
      - name: Kris
        role: Gitcoin citizen
        image: /images/site-shared/profiles/kris.webp
        quote: W3N reminds us daily of why we are here. Privacy, a basic human right, beats at the heart of the cypherpunk ethos, the essence of everything worth building. Their conferences are a gathering place for the mad ones, the dreamers, the rebels who see the world as it could be. They bring together the lunarpunks, the uncompromising builders, the visionaries, and the long-term thinkers. These are my people, our people, creating a future that remembers what matters.
      - name: Scott Moore
        role: Gitcoin
        image: /images/site-shared/profiles/scott-moore.webp
        quote: Web3Privacy is a reminder that cypherpunk values still matter, and that a better world is possible.
      - name: Eleftherios
        role: Radicle
        image: /images/site-shared/profiles/eleftherios.webp
        quote: Over the last two years, I mostly stepped away from crypto events, feeling disconnected from the nihilistic, short-term focus dominating much of the space. While I still believe in the tech's potential for net-positive use cases, the focus on hyper-speculation wasn't something I could get excited about. So, I focused on the work we do with Radicle and Drips, ignoring the rest. Then, almost a year ago, I found Web3PrivacyNow. They managed to amplify the cypherpunk voice within the cryptocurrency space, proving it’s not just alive but growing stronger. There is a thriving, principled community in crypto that it’s worth contributing to. Today it’s their 2nd birthday. Happy Birthday, Web3PrivacyNow! Your mission is more important now than ever.
      - name: Julio Linares
        role: Poetic Technologies
        image: /images/site-shared/profiles/julio-linares.webp
        quote: I think what you do in holding a space for the question of freedom, digital privacy and direct action is of greatly importance, specially today. As the politics of our world sink deeper into fascism, creating counter infrastructures and technologies that preserve people's autonomy and the freedom to reveal information will be vital for the resistance.
      - name: Vladimir S.
        role: '@officer_cla'
        image: /images/site-shared/profiles/vladimir-s.webp
        quote: Privacy is a right of every human being, not a privilege. It is very important that there is such a great project as @web3privacy and today it is turning 2 years old! Happy Birthday!
      - name: Lefteris Karapetsas
        role: Dyne.org
        image: /images/site-shared/profiles/lefteris-karapetsas.webp
        quote: A community I am part of, Web3Privacy now, has its 2 years birthday today! Privacy and data sovereignty are values I continuously stand for daily, especially through building Rotki. In the team of Web3Privacy now I found like-minded people, friends and comrades. Happy birthday!
      - name: Evin McMullen
        role: Privado ID
        image: /images/site-shared/profiles/evin-mcmullen.webp
        quote: Thank you so much Web3Privacy for leading the way to make space for these core values to shine through onchain.
      - name: Lasha
        role: Rarimo
        image: /images/site-shared/profiles/lasha.webp
        quote: I think Web3 privacy now has provided an umbrella for builders in the space, where we can not only find each other through a list of great projects but also have had many gatherings to network and connect giving rise to wild collabs.
      - name: Max
        role: Nym
        image: /images/site-shared/profiles/max.webp
        quote: Managing in a very real way to not only create and expand the tent of those involved in privacy development, but buy up and update the Cypherpunk ethos and what it means to work on meaningful parallel technologies. Spreading the message and bringing back cultural hacking and subversion. Basically the only good parties in crypto and all around great ethos and crew.
      - name: Guru
        role: Waku
        image: /images/site-shared/profiles/guru.webp
        quote: The whole narrative of web3 especially during global events was just about blockchains before Web3PrivacyNow. Over the last two years, Web3Privacy collective has built mainstream awareness about the essence of privacy and cypherpunk ethos in the Web3 ecosystem.
      - name: Will Scott
        role: Filecoin
        image: /images/site-shared/profiles/will-scott.webp
        quote: Having an identity to rally around is critical for change. In 2 years, web3privacy now has become that identity for the importance of privacy in all forms.
      - name: Jaya
        role: Nym
        image: /images/site-shared/profiles/jaya.webp
        quote: Happy birthday to Web3 Privacy Now! You are incredibly important as an independent industry body - with research projects and reports providing an essential overview and benchmarking of development of Web3 privacy software. Continue your good work of undoing the surveillance driven digital economy and advocating for privacy as a fundamental human right!
      - name: Ying Tong
        role: Independent Applied Cryptographer
        image: /images/site-shared/profiles/ying-tong.webp
        quote: web3 provides a mechanism for intelligent cooperation among distributed entities, and central to the realisation of this vision, is the ability to do so privately. I am grateful to w3pn for creating a platform for building, discussing, and advocating in this problem space.
      - name: Andrew Woo
        role: Protocol Labs
        image: /images/site-shared/profiles/andrew-woo.webp
        quote: Privacy, censorship resistance, and verifiability are core to digital human rights - and essential for a more open, fair internet. Web3Privacy fights for these values, building tools and advocacy that give people real agency online. At Protocol Labs, we're proud to support their work. It's a critical part of creating systems that serve humanity, not control it. Happy 2nd birthday!
      - name: Nick Almond
        role: FactoryDAO
        image: /images/site-shared/profiles/nick-almond.webp
        quote: I've had the pleasure of watching this community develop over the last 2 years and participated in 3 of their events. Every one of them has had a unique vibe with deep critical thinking on the nature of the industry, with a strong practical advocacy for privacy technologies. The cypherpunk ethos is returning to crypto and I think this is in no small part down to the hard work of @nicksvyaznoy, @PG_CDG and the rest of the @web3privacy team, who are all genuinely welcoming and wonderful people. Follow them, support them, make sure to get to the future events!
      - name: Matteo Tambussi
        role: Stake Capital
        image: /images/site-shared/profiles/matteo-tambussi.webp
        quote: The balance between Transparency and Privacy, accountable and unaccountable, manifest and secret, convex and concave, 1 and 0 is one of the most fun puzzles blockchain tech has to solve for the world. W3P community approaches this with incredible humility and an unravel-the-knot open debate approach. Also I like how they dress.
      - name: Juan
        role: '@juanaxyz00'
        image: /images/site-shared/profiles/juan.webp
        quote: Staying true to the reasons that brought you into the space in the first place can be a difficult and lonely endeavor; there are always shiny new things that get more attention and detract from the overarching mission of what sovereignty-enabling technology aims to offer. Web3Privacy has been a great way to meet other like-minded people, find common goals, and work toward them in a distributed fashion. If you're wondering whether you could provide something of value to the space by collaborating with Web3Privacy, the answer is yes!
      - name: Juraj Bednar
        role: ''
        image: /images/site-shared/profiles/juraj-bednar.webp
        quote: Web3Privacy is spreading awareness of Cypherpunk ideas among otherwise very solarpunk projects. Ideas of transparency should be balanced with user privacy, which is crucial for sovereignty. I think it created this spark of going back to cypherpunk roots. Happy birthday!
      - name: Ben West
        role: Thrive Protocol
        image: /images/site-shared/profiles/ben-west.webp
        quote: As surveillance technology spreads world wide and governments embrace authoritarianism, now more than ever the discussion of privacy and security is essential. I'm so glad the cypherpunk spirit is alive and well in this community. The underlying values are as important as the proliferation of the stack of private and secure technology and this group is facilitating both.
      - name: Josh Davila
        role: The Blockchain Socialist
        image: /images/site-shared/profiles/josh-davila.webp
        quote: Web3Privacy Now stands at the intersection of privacy activism, cypherpunk ethos, and class consciousness, reminding us that true digital freedom cannot exist without social justice. A new class of cypherpunks is being born.
      - name: Claire Kart
        role: Aztec
        image: /images/site-shared/profiles/claire-kart.webp
        quote: Web3Privacy Now stands at the intersection of privacy activism, cypherpunk ethos, and class consciousness, reminding us that true digital freedom cannot exist without social justice. A new class of cypherpunks is being born.
      - name: S E L Damaty
        role: Holonym
        image: /images/site-shared/profiles/s-el-damaty.webp
        quote: W3PN is a tuning fork for the values we aspire to see manifest in technology built for human flourishing. Technology too often removes agency from the equation, W3PN advocates for privacy as a precursor to technology that fortifies individual sovereignty.
      - name: Wesley
        role: '@wslyvh'
        image: /images/site-shared/profiles/wesley.webp
        quote: Happy birthday @web3privacy! Amazing to see cypherpunks values are still alive and kicking.
      - name: Ann Brody
        role: '@annbrody7'
        image: /images/site-shared/profiles/ann-brody.webp
        quote: Congratulations to the incredible team at @web3privacy for all your remarkable accomplishments over these years! Your passion and dedication to your work is incredible and we at @web3Privacy are truly grateful for your ongoing support.
      - name: Shayan Eskandari
        role: Ex-ConsenSys, Founder IranUnchained
        image: /images/site-shared/profiles/shayan-eskandari.webp
        quote: Web3Privacy started as a open source github project similar to any other awesome list of X on github. From there it grew to a big community of privacy advocates promoting the use of privacy tech in everyday life and even continues to bring forth hacktivists in the space to tell their stories and what this tech can become in the near future.
      - name: Gavin Birch
        role: '@Ether_Gavin'
        image: /images/site-shared/profiles/gavin-birch.webp
        quote: Hey happy birthday, @web3privacy. Incredible work you're doing, truly. For too many years too many of our community events have revolved around those hosted with vc money. You're leading the charge to actually rally around a renewed set of values, beyond tweeting about it.
      - name: Amit Chaudhary
        role: Veilnyx
        image: /images/site-shared/profiles/amit-chaudhary.webp
        quote: Web3Privacy Now is the best community for privacy that unites people to collaborate and turns user privacy into reality with exciting narratives.
      - name: LunarDAO
        role: ''
        image: /images/site-shared/profiles/lunar-dao.webp
        quote: A catalyst leading a brilliant charge into privacy content for the web3 ecosystem.
      - name: GnosisDAO
        role: '@GnosisDAO'
        image: /images/site-shared/profiles/gnosis-dao.webp
        quote: Happy Birthday @web3privacy! We need privacy. Privacy needs us. Choices have an impact!
      - name: Eléonore Blanc
        role: CryptoCanal
        image: /images/site-shared/profiles/eleonore-blanc.webp
        quote: One event at a time, they are building an ecosystem to ensure that no one forgets the political frontiers being pushed by crypto. Web3Privacy Now has been rallying support and ensuring that privacy holds a prime spot at all the major conferences worldwide.
      - name: Alan
        role: '@tsu_kareta'
        image: /images/site-shared/profiles/alan-2.webp
        quote: 'Web3Privacy continues to impress. Their research and privacy explorer are exceptional initiatives. Now the project has blossomed into one of the loudest grassroots advocacy groups for #privacy. Nothing but love for their passion, ethics and drive.'
      - name: Hazel Hu
        role: GCC of Commons
        image: /images/site-shared/profiles/hazel-hu.webp
        quote: Web3 privacy reminds me of why I first joined this industry. I was astonished by Bitcoin and Ethereum's design and their potential to bring unprecedented freedom to individuals. While the current market has diverged from our initial vision, communities like this one can help us realign with our original goals.
      - name: Jacob Czepluch
        role: '@_czepluch'
        image: /images/site-shared/profiles/jacob-czepluch.webp
        quote: Congratulations on the 2 years anniversary @web3privacy. You're doing some of the most important work in crypto by bringing focus to the important human right of privacy. I'm happy to have been a small part of this so far. Here's to many more years and keep up the good work!
      - name: Pie Man
        role: Fairblock
        image: /images/site-shared/profiles/pie-man.webp
        quote: 'Most bullish event by far in EthCC was Web3Privacy Now: right in the middle of the park without anything fancy going on, the only incentive to stay was lovely people with extreme passion for deep but practical steps, cryptography, and amazing applications.'
      - name: Václav Pavlin
        role: '@vpavlin'
        image: /images/site-shared/profiles/vaclav-pavlin.webp
        quote: I joined @Waku_org in April last year and I had no clue what privacy really means. I grew up with "You have nothing to hide!" mantra all around me. Then I decided to dive in a little and submitted a talk to the @web3privacy event. The rabbit hole is deep. It has been an honour to be part of the movement and journey of Web3Privacy Now! Happy birthday y'all! Kudos to @nicksvyaznoy and @PG_CDG for kicking it - it's been hard, but it seems like more and more people care, so it will only get harder.
