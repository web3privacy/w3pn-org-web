mission:
  text: |-
    The Builder Pack is a framework designed to support developers in creating privacy-focused applications, particularly in hackathon and early-stage environments. It provides structured guidance, resources, and use-case inspiration.

    It connects ideation with execution, helping builders move from initial concepts to more meaningful and viable privacy solutions aligned with real ecosystem needs.
  readMoreHref: https://build.web3privacy.info
links:
  url: https://build.web3privacy.info
contribute:
  text: Use the framework in your next build, contribute examples, and help expand the resources available to privacy-focused builders.
