mission:
  text: >-
    The publishing initiatives explore privacy through both long-form and experimental formats, including books and
    zines. They aim to capture the cultural, philosophical, and technical dimensions of privacy.


    These formats complement research and education efforts by making privacy narratives more accessible and expressive.
