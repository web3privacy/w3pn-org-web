mission:
  text: |-
    Personal Stacks documents the actual privacy setups used by experts, showcasing how different tools are combined in real-world scenarios. It shifts the focus from abstract recommendations to practical implementation.

    By exposing these configurations, the project helps users understand how privacy tools interact and how to construct their own operational stack based on proven practices.
  readMoreHref: https://stacks.web3privacy.info
