mission:
  text: |-
    Drips for Privacy was created to transform the Privacy Proof 2024 Awards into a more durable funding mechanism for privacy projects. Rather than ending with a one-time round, it introduced a way to keep supporting recognized projects over a longer period.

    Built on Drips and deployed on Optimism, the initiative organized selected nominees into three lists: Favourite Pro-Privacy Project, Exciting Innovation, and Major News or Key Event. Projects could claim their repositories, define maintainers and dependencies, and receive funds through a recurring onchain distribution model.

    The campaign covered more than 70 GitHub repositories and 6 Ethereum wallet addresses. Its main result was the creation of a continuous funding rail for privacy-focused open-source work, designed to distribute support over time instead of through a single payout.
