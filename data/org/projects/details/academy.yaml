mission:
  text: |-
    Web3Privacy Academy is the educational arm of Web3Privacy Now. It was launched to make privacy learning easier to access and more useful in practice, especially for people entering the space without a strong technical or historical background.

    The platform combines free courses, interviews, curated resources, and supporting materials such as a glossary and reading library. Its content spans privacy fundamentals, cypherpunk history, zero-knowledge, digital rights, decentralized coordination, surveillance, and practical tools.

    Beyond education itself, Academy is designed as a longer-term pipeline: first helping people learn, then helping them build, and eventually supporting stronger project incubation around privacy-focused work.
  readMoreHref: https://academy.web3privacy.info
