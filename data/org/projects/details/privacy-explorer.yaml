mission:
  text: |-
    Privacy Explorer is a ranked, open-source database that helps people explore and compare the privacy, security, and reliability of Web3 projects. As a privacy-first and neutral platform, it makes fragmented ecosystem data legible through searchable profiles, filters, detailed project pages, and transparent scoring.

    The project is part of Web3Privacy Now and is maintained through volunteer and community contributions. Its front-end, data repository, and self-hosted JSON API are public, so anyone can review the methodology, follow updates, submit corrections, and contribute without needing an account.
  readMoreHref: https://explorer.web3privacy.info/about
