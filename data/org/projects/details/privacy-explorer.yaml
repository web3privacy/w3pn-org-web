  url: https://explorer.web3privacy.info
  docs: https://docs.web3privacy.info/projects/privacy-explorer
  github: https://github.com/web3privacy/explorer
contribute:
  text: Privacy Explorer is community-maintained and open source. You can submit a new project, edit an existing listing, improve the front-end or data repositories, and help keep the database transparent, searchable, and up to date.
  textShort: Open source and community-maintained—use the How to links to submit or edit listings, improve code or data, and keep Explorer accurate.
  links:
