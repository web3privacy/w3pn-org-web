mission:
  text: >-
    The Cypherpunk OSINT Toolkit provides resources and tools for conducting open-source intelligence research with a
    privacy-first mindset. It supports investigators, researchers, and activists working with publicly available data.


    The toolkit emphasizes operational security and responsible data usage, aligning OSINT practices with
    privacy-preserving principles.
