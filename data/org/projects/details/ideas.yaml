mission:
  text: >-
    The Privacy Idea Generator is a tool that helps users explore and generate new privacy-focused project ideas. It
    aggregates ideas from community contributions, research, and internal frameworks.


    It is particularly useful in early-stage ideation, lowering the barrier to entry for builders and enabling faster
    exploration of relevant privacy use cases.
