mission:
  text: |-
    Jobs in Privacy is a dedicated job board focused on opportunities within the privacy and Web3 ecosystem. It aggregates roles across projects and organizations, making it easier for contributors to find relevant work aligned with privacy values.

    Beyond listings, it acts as a signal layer for ecosystem growth by highlighting hiring demand and emerging roles in privacy-focused development, research, and operations.
