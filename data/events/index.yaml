  description: Third Ethereum Cypherpunk Congress in Mumbai, positioned as a large-scale cypherpunk and human-rights gathering during Devcon week.
  speakers-count: 33
  program-outline:
  - title: Democratising AI
    description: Open-source AI, harmful neo-colonial agentic practices, and a better vision of AI commons.
  - title: Internet censorship
    description: Internet shutdowns, mesh networks, cross-border digital currencies, and practical FOSS under repression.
  - title: Positive freedom
    description: Interactive experiences oriented toward collective socio-technical and political imagination.
  - title: Digital Public Infrastructure
    description: Privacy and data-protection challenges around Aadhaar, UPI, DigiLocker, and related public infrastructure.
  - title: Neo-cypherpunk
    description: Digital activism through encryption, communal care, and default privacy accessible to non-technical people.
  - title: Sustainable privacy economy
    description: How protocols, activists, and public-goods funders can sustain privacy tech and FOSS.
  themes:
  - The Ancestral Fork
  - Global South digital rights
  - AI commons
  - Internet shutdown resilience
  - Digital public infrastructure
  - Neo-cypherpunk practice
