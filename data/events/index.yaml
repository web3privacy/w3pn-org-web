  description: Neo-cypherpunk summit in Berlin focused on activist culture, digital rights, free software sustainability, and privacy-preserving technology.
  speakers-count: 41
  schedule:
  - start: '10:00'
    end: '18:00'
    title: Neocypherpunk Summit
    note: Full-day summit at Funkhaus Berlin
  program-outline:
  - title: Dialogue
    description: Discourse to identify and bridge gaps in knowledge, alignment, values and vision.
  - title: Knowledge Exchange
    description: Skill-sharing on hacking, organizing, advocacy, and practical privacy tactics.
  - title: Rituals
    description: Participatory activations exploring privacy through creativity and play.
  - title: Field Building
    description: Cross-disciplinary community weaving around privacy, power, and civic infrastructure.
  - title: Showcases
    description: Presentations of projects, protocols, and experiments shaping the future.
  - title: Debates
    description: Public arguments and critical discussion on the systems and norms that shape the internet.
  themes:
  - Cryptography as Civic Infrastructure
  - Resistance Networks
  - Open Protocols & Digital Autonomy
  - Digital Rights & Legal Defense
  - Privacy for the Commons
