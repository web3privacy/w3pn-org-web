    - description: A critique of crypto-capitalist culture and a search for alternatives.
      icon: shield
      title: Original Ethereum ethos x degen movement
    - description: Applied cryptography and the ethics of building privacy infrastructure.
      icon: shield
      title: The moral role of cryptography
    - description: Value crises, governance tensions, and possible futures for the ecosystem.
      icon: shield
      title: Political culture of Ethereum
