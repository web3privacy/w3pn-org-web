  content: This congress took place in Buenos Aires during Devconnect. Speakers included Zac Williamson, Peter Van Valkenburgh, Nick Almond, and Santiago Siri. It was framed as a larger field-building event around privacy culture, movement strategy, and the practical adoption of freedom technologies.
