shortDescription: The inaugural Web3Privacy Now summit during ETHPrague — foundations of the privacy movement in Web3.
topics:
  content: >-
    This summit took place in Prague during ETHPrague. Speakers included Ameen Soleimani, Guy Zyskind, Max Hampshire,
    and Antoni Zolciak. It combined a broader public program with cross-disciplinary discussion on privacy, governance,
    law, and freedom technology.
