topics:
  enabled: true
  content: >-
    Ethereum Privacy Stack brought together builders, researchers, and advocates around the core
    privacy directions emerging across Ethereum. The framing on Luma focused on transactional
    privacy, application privacy, institutional privacy, public goods, and the ecosystem role of
    privacy infrastructure.
