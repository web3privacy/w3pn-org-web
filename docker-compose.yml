services:
  w3pn-web:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      W3PN_DATA_ROOT: /app/data
      CHOKIDAR_USEPOLLING: "1"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./:/app
      - w3pn_node_modules:/app/node_modules
      - w3pn_next_cache:/app/.next
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    restart: unless-stopped

volumes:
  w3pn_node_modules:
  w3pn_next_cache:
